name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7
      - name: Build release APK
        run: |
          set -o pipefail
          gradle --no-daemon assembleRelease 2>&1 | tee build.log
      - name: Publish compile errors to the buildlog branch
        if: failure()
        run: |
          grep -E "^e: |error:|What went wrong|Execution failed" -A4 build.log | head -200 > /tmp/build-errors.txt || true
          git config user.name "ci"
          git config user.email "ci@users.noreply.github.com"
          git checkout --orphan buildlog
          git rm -rf --quiet . || true
          cp /tmp/build-errors.txt build-errors.txt
          git add build-errors.txt
          git commit -q -m "build errors for ${GITHUB_SHA}"
          git push -f origin buildlog
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk KalaKeyboard.apk
      - uses: actions/upload-artifact@v4
        with:
          name: KalaKeyboard
          path: KalaKeyboard.apk
      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: kala-v${{ github.run_number }}
          name: 喀啦鍵盤 v${{ github.run_number }}
          files: KalaKeyboard.apk
